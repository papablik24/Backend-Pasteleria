# Configuración común de la aplicación
spring.application.name=backpasteleria

# Perfil activo por defecto: 'dev' para desarrollo, 'prod' para producción
# Cambiar a 'prod' en producción o usar variable de entorno SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuración de base de datos común
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT settings
jwt.secret=${JWT_SECRET:changeit-changeit-changeit-0123456789}
jwt.expiration-ms=3600000

# Puerto del servidor (por defecto 8080)
server.port=8080
