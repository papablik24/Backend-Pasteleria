# Configuración para entorno de producción
# Este perfil requiere autenticación JWT para endpoints protegidos

# Base de datos - configurar con variables de entorno en producción
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/pasteleria_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# Desactivar logs de SQL en producción
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
