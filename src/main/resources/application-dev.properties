# Configuración para entorno de desarrollo
# Este perfil permite acceso libre a todos los endpoints para facilitar el desarrollo

# Base de datos local
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Mostrar SQL para depuración
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
